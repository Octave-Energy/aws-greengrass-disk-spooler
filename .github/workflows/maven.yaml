name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: '*'

permissions:
  contents: read
  pull-requests: write  # the coverage report comment

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # required by wagoid/commitlint-github-action to validate range of commits instead of just the latest one
      - uses: wagoid/commitlint-github-action@v6
        if: matrix.os == 'ubuntu-latest'
      - name: Set up JDK 1.8
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 8
          cache: maven
      - name: Clean /tmp
        # files of the runner itself cannot be removed: ignore them instead of failing the step
        run: rm -rf /tmp/* 2>/dev/null || true
        if: matrix.os == 'ubuntu-latest'
      - name: Build with Maven (not Windows)
        env:
          AWS_REGION: us-west-2
        run: mvn -ntp -U clean verify
        if: matrix.os != 'windows-latest'
      - name: Build with Maven (Windows)
        env:
          AWS_REGION: us-west-2
        run: mvn -ntp -U clean verify
        shell: cmd
        if: matrix.os == 'windows-latest'
      - name: Upload Failed Test Report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Failed Test Report ${{ matrix.os }}
          path: target/surefire-reports
      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: Coverage Report ${{ matrix.os }}
          path: target/jacoco-report
      - name: Coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: madrapps/jacoco-report@v1
        with:
          paths: ${{ github.workspace }}/target/jacoco-report/jacoco.xml
          token: ${{ github.token }}
          title: Unit Tests Coverage Report
          update-comment: true
          comment-type: both  # PR comment and job summary
          min-coverage-overall: 65
          # report, do not gate: a coverage drop or a missing permission (PRs from forks) only logs a warning
          continue-on-error: true
